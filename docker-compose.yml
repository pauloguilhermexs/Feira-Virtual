services:
  db:
    image: mysql:8.4
    container_name: feira_virtual_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: feira_virtual
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    container_name: feira_virtual_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DJANGO_DEBUG: "0"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-chave-secreta-de-producao-troque-aqui}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-*}
      DB_ENGINE: mysql
      DB_NAME: feira_virtual
      DB_USER: root
      DB_PASSWORD: root
      DB_HOST: db
      DB_PORT: "3306"
      CORS_ALLOW_ALL_ORIGINS: "1"
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost:8000,http://127.0.0.1:8000}
    ports:
      - "8000:8000"
    volumes:
      - media_data:/app/media

volumes:
  mysql_data:
  media_data:
