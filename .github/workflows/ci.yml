name: CI — Feira Virtual

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Checks, Schema e Testes (Django)
    runs-on: ubuntu-latest

    env:
      DB_ENGINE: sqlite
      DJANGO_DEBUG: "1"
      DJANGO_SECRET_KEY: "ci-secret-key-feira-virtual-com-mais-de-cinquenta-caracteres-0123456789"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1"

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          python -m playwright install --with-deps chromium

      - name: Verificação do sistema (manage.py check)
        run: python manage.py check

      - name: Verificar migrações pendentes
        run: python manage.py makemigrations --check --dry-run

      - name: Validar schema OpenAPI (drf-spectacular)
        run: python manage.py spectacular --validate --file /tmp/schema.yml

      - name: Verificar configurações de produção (check --deploy)
        env:
          DJANGO_DEBUG: "0"
          SECURE_SSL_REDIRECT: "1"
        run: python manage.py check --deploy

      - name: Executar suíte de testes com cobertura
        run: |
          make test-all

      - name: Publicar evidências mesmo em falhas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-testes
          path: reports/testes/
          if-no-files-found: warn

  frontend-lint:
    name: Lint e Formatação do Front-End (ESLint + Prettier)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Instalar ferramentas de qualidade (devDependencies)
        run: npm ci

      - name: Verificar lint JavaScript (ESLint)
        run: npm run lint:js

      - name: Verificar formatação JS e CSS (Prettier)
        run: npm run format:check

  docker-build:
    name: Validação Docker e Compose
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-lint]

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Validar sintaxe do docker-compose.yml
        run: docker compose config --quiet

      - name: Build da imagem Docker
        run: docker build -t feira-virtual:ci .
