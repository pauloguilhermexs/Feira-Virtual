services:
  db:
    image: mysql:8.4
    container_name: feira_virtual_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-feira_virtual}
      MYSQL_USER: ${DB_USER:-feira_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-feira_senha_local_dev}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_senha_local_dev}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysqladmin ping -h localhost -u \"$$MYSQL_USER\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    container_name: feira_virtual_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DJANGO_DEBUG: "${DJANGO_DEBUG:-0}"
      DJANGO_SECRET_KEY: "${DJANGO_SECRET_KEY:-troque-esta-chave-secreta-por-uma-com-50-caracteres-em-producao}"
      DJANGO_ALLOWED_HOSTS: "${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}"
      SECURE_SSL_REDIRECT: "${SECURE_SSL_REDIRECT:-0}"
      ENABLE_SWAGGER: "${ENABLE_SWAGGER:-0}"
      SHOW_DEMO_SHORTCUTS: "${SHOW_DEMO_SHORTCUTS:-0}"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
      DB_ENGINE: mysql
      DB_NAME: "${DB_NAME:-feira_virtual}"
      DB_USER: "${DB_USER:-feira_user}"
      DB_PASSWORD: "${DB_PASSWORD:-feira_senha_local_dev}"
      DB_HOST: db
      DB_PORT: "3306"
      CORS_ALLOW_ALL_ORIGINS: "${CORS_ALLOW_ALL_ORIGINS:-0}"
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-http://localhost:8000,http://127.0.0.1:8000}"
      CSRF_TRUSTED_ORIGINS: "${CSRF_TRUSTED_ORIGINS:-http://localhost:8000,http://127.0.0.1:8000}"
      PIX_WEBHOOK_SECRET: "${PIX_WEBHOOK_SECRET:-}"
      TAXA_ENTREGA_PADRAO: "${TAXA_ENTREGA_PADRAO:-0.00}"
      EMAIL_BACKEND: "${EMAIL_BACKEND:-django.core.mail.backends.console.EmailBackend}"
      EMAIL_HOST: "${EMAIL_HOST:-}"
      EMAIL_PORT: "${EMAIL_PORT:-587}"
      EMAIL_HOST_USER: "${EMAIL_HOST_USER:-}"
      EMAIL_HOST_PASSWORD: "${EMAIL_HOST_PASSWORD:-}"
      EMAIL_USE_TLS: "${EMAIL_USE_TLS:-1}"
      DEFAULT_FROM_EMAIL: "${DEFAULT_FROM_EMAIL:-noreply@feira-virtual.local}"
    ports:
      - "8000:8000"
    volumes:
      - media_data:/app/media

volumes:
  mysql_data:
  media_data:
